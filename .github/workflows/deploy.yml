name: Verify and deploy Recetario

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    # Match the supported macOS browser suite, including WebKit video decoding.
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Validate production configuration
        run: |
          node --input-type=module <<'JS'
          for (const name of ["VITE_SUPABASE_URL", "VITE_SUPABASE_PUBLISHABLE_KEY"]) {
            if (!process.env[name]) throw new Error(`Missing repository variable: ${name}`);
          }
          if (!process.env.VITE_SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_")) {
            throw new Error("The browser build requires a public Supabase publishable key.");
          }
          if (new URL(process.env.VITE_SUPABASE_URL).protocol !== "https:") {
            throw new Error("The production Supabase URL must use HTTPS.");
          }
          JS
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck:e2e
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser tests
        run: npm run test:e2e
      - name: Build production site
        run: npm run build
      - name: Record deployed source
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from "node:fs";
          writeFileSync("dist/release.json", JSON.stringify({
            source_commit: process.env.GITHUB_SHA,
            built_at: new Date().toISOString(),
            workflow_run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }, null, 2) + "\n");
          JS
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: node_modules/.cache/e2e-results
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
