<h1>Guacamole de la abuela</h1>
<p>Rinde: 4 porciones</p>
<h2>Ingredientes</h2>
<ul><li>3 aguacates</li><li>1/2 cebolla picada</li><li>Sal al gusto</li></ul>
<h2>Preparación</h2>
<ol><li>Machaca los aguacates.</li><li>Mezcla con la cebolla y la sal.</li></ol>
